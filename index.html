<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceTiming - Live Výsledky</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 { 
            font-size: 3em; 
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .training-info {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .last-update { 
            opacity: 0.7; 
            font-size: 0.95em;
        }
        
        .time-display {
            background: #000;
            color: #ff0000;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 80px;
            font-weight: bold;
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            letter-spacing: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .time-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(255,0,0,0.05) 100%);
        }
        
        .podium {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .podium-place {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(0);
            transition: transform 0.3s;
        }
        
        .podium-place:hover {
            transform: translateY(-5px);
        }
        
        .podium-place.gold { 
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            grid-row: 1;
        }
        
        .podium-place.silver { 
            background: linear-gradient(135deg, #C0C0C0 0%, #999 100%);
        }
        
        .podium-place.bronze { 
            background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%);
        }
        
        .podium-medal {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .podium-position {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .podium-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .podium-time {
            font-family: 'Consolas', monospace;
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .results-section {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        thead {
            background: #667eea;
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }
        
        th:first-child {
            border-top-left-radius: 10px;
        }
        
        th:last-child {
            border-top-right-radius: 10px;
        }
        
        td {
            padding: 15px;
            color: #333;
            border-bottom: 1px solid #eee;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tbody tr {
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        
        tbody tr:nth-child(even) {
            background: rgba(0,0,0,0.02);
        }
        
        .position {
            font-weight: bold;
            font-size: 1.3em;
            color: #667eea;
            width: 60px;
        }
        
        .start-number {
            font-weight: bold;
            color: #764ba2;
        }
        
        .time {
            font-family: 'Consolas', monospace;
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
            color: #999;
        }
        
        .error {
            background: #f44336;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .time-display { font-size: 48px; padding: 20px; }
            .podium { grid-template-columns: 1fr; }
            th, td { padding: 10px; font-size: 0.9em; }
            table { font-size: 0.85em; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏁 RaceTiming - Live Výsledky</h1>
            <div class="training-info" id="trainingInfo">Načítání...</div>
            <div class="last-update">
                <span class="live-indicator"></span>
                <span id="lastUpdate">Načítání...</span>
            </div>
        </header>
        
        <div class="time-display" id="lastTime">--:--:--</div>
        
        <div class="podium" id="podium" style="display: none;">
            <!-- Podium will be inserted here -->
        </div>
        
        <div class="results-section">
            <h2>📊 Kompletní Výsledky</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pořadí</th>
                        <th>St. č.</th>
                        <th>Jméno</th>
                        <th>Příjmení</th>
                        <th>Klub</th>
                        <th>Kategorie</th>
                        <th>Čas</th>
                    </tr>
                </thead>
                <tbody id="results">
                    <tr><td colspan="7" class="loading">Načítání výsledků...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let currentData = null;
        let errorCount = 0;
        
        async function loadResults() {
            try {
                const response = await fetch('data/latest.json?' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                currentData = data;
                errorCount = 0;
                
                // Update training info
                document.getElementById('trainingInfo').textContent = 
                    `${data.trainingName} - ${formatDate(data.trainingDate)} (${data.totalCompetitors} závodníků)`;
                
                // Update last update time
                document.getElementById('lastUpdate').textContent = 
                    `Aktualizováno: ${data.lastUpdate}`;
                
                // Update last time display
                if (data.results.length > 0) {
                    document.getElementById('lastTime').textContent = data.results[0].totalTime;
                }
                
                // Show podium if we have 3+ competitors
                if (data.results.length >= 3) {
                    displayPodium(data.results);
                }
                
                // Update results table
                const tbody = document.getElementById('results');
                tbody.innerHTML = data.results.map(r => `
                    <tr>
                        <td class="position">${r.position}.</td>
                        <td class="start-number">${r.startNumber}</td>
                        <td>${r.firstName}</td>
                        <td><strong>${r.lastName}</strong></td>
                        <td>${r.club}</td>
                        <td>${r.category}</td>
                        <td class="time">${r.totalTime}</td>
                    </tr>
                `).join('');
                
            } catch (error) {
                console.error('Error loading results:', error);
                errorCount++;
                
                if (errorCount > 3) {
                    document.getElementById('results').innerHTML = 
                        '<tr><td colspan="7" class="loading">Chyba při načítání výsledků. Zkontrolujte připojení.</td></tr>';
                }
            }
        }
        
        function displayPodium(results) {
            const medals = ['🥇', '🥈', '🥉'];
            const classes = ['gold', 'silver', 'bronze'];
            
            const podiumHtml = results.slice(0, 3).map((r, i) => `
                <div class="podium-place ${classes[i]}">
                    <div class="podium-medal">${medals[i]}</div>
                    <div class="podium-position">${r.position}. místo</div>
                    <div class="podium-name">${r.firstName} ${r.lastName}</div>
                    <div style="font-size: 1.1em; margin-top: 5px;">${r.startNumber} | ${r.club}</div>
                    <div class="podium-time">${r.totalTime}</div>
                </div>
            `).join('');
            
            const podium = document.getElementById('podium');
            podium.innerHTML = podiumHtml;
            podium.style.display = 'grid';
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('cs-CZ', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }
        
        // Auto-refresh every 5 seconds
        setInterval(loadResults, 5000);
        
        // Initial load
        loadResults();
    </script>
</body>
</html>
